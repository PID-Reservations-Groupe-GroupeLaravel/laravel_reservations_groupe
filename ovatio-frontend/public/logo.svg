<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000666;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a237e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#mainGrad)" />

  <!-- Inner elegant design -->
  <g transform="translate(60, 60)">
    <!-- Spotlight beam - stylized -->
    <path d="M -20 -35 L 20 -35 L 15 -5 L -15 -5 Z" fill="#fdd400" opacity="0.2"/>
    <path d="M -15 -35 L 15 -35 L 12 -8 L -12 -8 Z" fill="#fdd400" opacity="0.4"/>

    <!-- Center stage circle -->
    <circle cx="0" cy="0" r="18" fill="#fdd400" opacity="0.95"/>

    <!-- "SO" letters - elegant serif style -->
    <g transform="translate(0, 5)">
      <!-- "S" -->
      <g transform="translate(-10, 0)">
        <path d="M -4 -6 Q -6 -4 -4 -2 Q -2 0 -4 2 Q -6 4 -4 6"
              fill="none" stroke="#000666" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- "O" -->
      <g transform="translate(8, 0)">
        <circle cx="0" cy="0" r="5" fill="none" stroke="#000666" stroke-width="2.5"/>
      </g>
    </g>

    <!-- Decorative lines representing audience/applause -->
    <g stroke="#fdd400" stroke-width="1.5" opacity="0.6">
      <!-- Left arc -->
      <path d="M -28 -5 Q -32 10 -28 20" fill="none" stroke-linecap="round"/>
      <!-- Right arc -->
      <path d="M 28 -5 Q 32 10 28 20" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Bottom accent dots -->
    <circle cx="-8" cy="28" r="1.5" fill="#fdd400" opacity="0.7"/>
    <circle cx="0" cy="30" r="1.5" fill="#fdd400" opacity="0.7"/>
    <circle cx="8" cy="28" r="1.5" fill="#fdd400" opacity="0.7"/>
  </g>

  <!-- Border accent -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="#fdd400" stroke-width="1.5" opacity="0.4"/>
</svg>
